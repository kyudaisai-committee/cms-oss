name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.changesets.outputs['pr-number'] }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create or update version pull request
        id: changesets
        uses: changesets/action/version@v2
        with:
          pr-base-branch: main
          pr-title: "chore: パッケージバージョンを更新"
          commit-message: "chore: パッケージバージョンを更新"
          script: pnpm changeset:version && pnpm format

  release:
    name: Build and publish product Release
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.pr_number == ''
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify workspaces
        run: pnpm verify
      - name: Pack product CLI
        run: pnpm pack:product --pack-destination dist/release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/cli/scripts/publish-product-release.mjs dist/release
