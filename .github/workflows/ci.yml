name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run oxlint
        run: pnpm exec oxlint --deny-warnings

      - name: Run oxfmt
        run: pnpm exec oxfmt --check

      - name: Run cspell
        run: pnpm exec cspell .

      - name: Run product consumer typecheck regression
        run: pnpm --filter @repo/cli run test:product-consumer
